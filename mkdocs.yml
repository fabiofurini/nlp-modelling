site_name: NLP Modelling · Fabio Furini
site_url: https://fabiofurini.github.io/nlp-modelling/
site_description: >-
  Nonlinear programming models:
  lecture notes, Python/Gurobi code, data and case studies.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/nlp-modelling
copyright: >-
  &copy; 2026 Fabio Furini — text, figures and data licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  Python code licensed under
  <a href="https://github.com/fabiofurini/nlp-modelling/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/chart-bell-curve-cumulative
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/function-variant
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/dots-grid
      link: https://fabiofurini.github.io/integer-linear-programming/
      name: Integer Linear Programming
    - icon: material/vector-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/graph-outline
      link: https://fabiofurini.github.io/network-optimization/
      name: Network Optimization
    - icon: material/hexagon-multiple-outline
      link: https://fabiofurini.github.io/combinatorial-optimization/
      name: Combinatorial Optimization Problems
    - icon: material/table-large
      link: https://fabiofurini.github.io/dynamic-programming/
      name: Dynamic Programming
    - icon: material/map-marker-path
      link: https://fabiofurini.github.io/heuristic-algorithms/
      name: Heuristic Algorithms
    - icon: material/approximately-equal
      link: https://fabiofurini.github.io/approximation-algorithms/
      name: Approximation Algorithms
    - icon: material/chart-line
      link: https://fabiofurini.github.io/lp-modelling/
      name: LP Modelling
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
  alternate:
    - name: English
      link: https://fabiofurini.github.io/nlp-modelling/
      lang: en
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-pnl/
      lang: it

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=8a997f6627
  # laboratorio interattivo (genera_laboratorio.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=d4d7e13ccc
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=4f68d7e6a2
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # laboratorio interattivo (genera_laboratorio.py): JSXGraph, il motore, gli helper comuni, i dati, poi le ricette
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=a67c342fc6
  - javascripts/gi-comune.js?v=74d7bb93a0
  - javascripts/gi-ott.js?v=4e022c9162
  - javascripts/gi-pnl-dati.js?v=5c5208094f
  - javascripts/gi-pnl-modelli.js?v=40ee92ee69
  - javascripts/gi-pnl-app.js?v=d93a2aed07
  - javascripts/quiz.js?v=be7fae2b85

# the single app pages are not in the menu: the lab is one entry
not_in_nav: |
  /lab/*.md
  !/lab/index.md

nav:
  - Home: index.md
  - Tools:
      - tools.md
      - Theory, nonlinear optimization: theory-nonlinear.md
      - Solver, nonlinear models: solver-nonlinear.md
      - Notebooks in Colab: notebooks.md
  - Deterministic models:
      - deterministic-models.md
      - Production with quadratic smoothing: production-quadratic.md
      - Supply chain and CO2: supplychain.md
      - Markowitz portfolio: markowitz.md
      - Pricing and revenue management: pricing.md
      - Advertising budget: budget.md
      - Continuous location: location.md
      - EV charging with a smooth profile: ev-charging-quadratic.md
      - Queues and service capacity: queues.md
  - Optimization and machine learning:
      - optimization-ml.md
      - Support Vector Machine: svm.md
      - Least-squares regression: least-squares.md
  - Exercises: exercises/index.md
  - Quiz: self-assessment.md
  - Lab: lab/index.md
  - Downloads: downloads.md
  - Index:
      - Syllabus: syllabus.md
      - How to work with the course: organization.md
